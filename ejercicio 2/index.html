<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - LocalStorage</title>
</head>
<body>
    <main>
        <h1>Registro de Datos</h1>
        
        <!--formulario de captura -->
        <form id="formUsuario">
            <div>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <br>
            <div>
                <label for="correo">Correo Electrónico:</label><br>
                <input type="email" id="correo" name="correo" required>
            </div>
            <br>
            <button type="submit">Guardar</button>
            <button type="button" id="btnMostrar">Mostrar</button>
            <button type="button" id="btnLimpiar">Limpiar</button>
        </form>

        <hr>

        <section>
            <h2>Información almacenada actualmente:</h2>
            <p id="resultadoNombre"><strong>Nombre:</strong> (Ninguno)</p>
            <p id="resultadoCorreo"><strong>Correo:</strong> (Ninguno)</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
